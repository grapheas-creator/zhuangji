<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>旺财装机店 · 加载中</title>
<style>
html,body{margin:0;height:100%;background:#0a0908;color:#f2e9da;font-family:system-ui,-apple-system,'PingFang SC',sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(900px 520px at 50% -10%,rgba(255,170,90,.18),transparent 60%),linear-gradient(180deg,#151210,#080706)}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0 26px;text-align:center}
.logo{font-size:30px;font-weight:900;letter-spacing:4px;background:linear-gradient(180deg,#fff3d6,#ffc66d 55%,#e3912f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:6px;font-size:10px;letter-spacing:6px;color:#b79a74}
.bar{margin:30px auto 0;width:min(80vw,340px);height:8px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,210,160,.22);overflow:hidden}
.bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffb463,#ffe0ae 60%,#ffb463);box-shadow:0 0 14px rgba(255,170,90,.6);transition:width .25s ease}
.meta{display:flex;justify-content:space-between;width:min(80vw,340px);margin:10px auto 0;font-size:11.5px;color:#c9b79c}
.meta b{color:#ffe0ae}
.tip{margin-top:16px;font-size:10.5px;color:#8f8069;line-height:1.7}
.retry{margin-top:14px;padding:10px 18px;border-radius:10px;border:1px solid #ffd0a0;background:#ffb463;color:#2a1705;font-weight:800;display:none}
</style></head><body>
<div class="bg"></div>
<div class="wrap">
  <div class="logo">旺财装机店</div>
  <div class="sub">WANG CAI PC SHOP</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="meta"><span id="msg">正在下载游戏…</span><b id="pct">0%</b></div>
  <div class="tip">首次进入需要完整下载一次（约 2.7MB）<br>下载完成后就会直接开玩，之后不用再等</div>
  <button class="retry" id="retry">重新下载</button>
</div>
<script>
(function(){
  var FILE='game-lite.html?v=403';
  var bar=document.getElementById('bar'),pct=document.getElementById('pct'),msg=document.getElementById('msg'),retry=document.getElementById('retry');
  var timer=null,p=0,done=false;
  function set(v,t){bar.style.width=v.toFixed(1)+'%';pct.textContent=Math.round(v)+'%';if(t)msg.textContent=t;}
  function fail(t){if(done)return;done=true;clearInterval(timer);msg.textContent=t||'下载失败，请点下面重试';retry.style.display='inline-block';}
  function enter(text){
    if(done)return;done=true;clearInterval(timer);set(100,'下载完成，正在进入…');
    try{document.open();document.write(text);document.close();}catch(e){fail('进入失败：'+e.message);}
  }
  function run(){
    done=false;retry.style.display='none';p=0;set(0,'正在连接…');
    /* 没有进度事件时也让进度条缓慢往前走，避免看起来卡死 */
    clearInterval(timer);
    timer=setInterval(function(){if(!done&&p<88){p+=1.2;set(p,'正在下载游戏…');}},420);
    var xhr=new XMLHttpRequest();
    xhr.open('GET',FILE+'&t='+Date.now(),true);
    xhr.responseType='text';
    xhr.timeout=120000;
    xhr.onprogress=function(e){
      if(e.lengthComputable&&e.total){
        var v=e.loaded/e.total*100;
        p=Math.max(p,Math.min(99,v));
        set(p,'正在下载 '+ (e.loaded/1048576).toFixed(2)+' / '+(e.total/1048576).toFixed(2)+' MB');
      }
    };
    xhr.onload=function(){
      if(xhr.status===200&&xhr.responseText&&xhr.responseText.length>50000){enter(xhr.responseText);}
      else{fail('下载不完整（HTTP '+xhr.status+'），点下面重试');}
    };
    xhr.onerror=function(){fail('网络中断，点下面重试');};
    xhr.ontimeout=function(){fail('下载超时，点下面重试');};
    xhr.send();
  }
  retry.onclick=run;
  run();
})();
</script></body></html>
